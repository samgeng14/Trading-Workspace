# Connection settings for every IBKR client in the repo. Resolved by
# src/broker/ibkr/settings.py; environment variables override these
# (IBKR_HOST, IBKR_PORT_PAPER, IBKR_PORT_LIVE, IBKR_ACCOUNT_PAPER, ...).
#
# Host ports:  IB Gateway paper 4002 / live 4001,  TWS paper 7497 / live 7496.
# ibgw/docker-compose.yml publishes the container's paper socket on 4002.
#
# Client IDs are fixed per role (client_id_base + offset, see ROLE_OFFSETS
# in settings.py): orders = base+0, account = base+1, market data = base+2,
# ..., dashboard = base+7, doctor = base+9.
#
# Nothing else is read from here. Order types are chosen per batch by
# src/broker/ibkr/auction.py (market-on-close before the closing auctions'
# cutoff, else market-on-open), and read-only connections are the caller's
# choice (the reconcile and executions clients are read-only).
ibkr:
  host: 127.0.0.1

  paper:
    port: 4002
    client_id_base: 300
    account: ""        # empty = first managed account (must start with "D")

  live:
    port: 4001
    client_id_base: 400
    account: ""
