# Not read by anything yet. The Postgres store for orders, fills, positions
# and NAV is planned (docs/PLAN.md); until it is wired, these settings and
# table names have no effect.

database:
  enabled: false
  driver: postgresql
  host: 127.0.0.1
  port: 5432
  name: trading
  user: postgres
  password: postgres
  schema: public

tables:
  market_data: market_data
  signals: signals
  targets: targets
  positions: positions
  orders: orders
  fills: fills
  run_logs: run_logs
