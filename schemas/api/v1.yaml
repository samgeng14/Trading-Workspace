openapi: 3.1.0
info:
  title: DV02 Fund API
  version: 1.0.0
  description: |
    Contract between the dashboard (apps/web) and the backend. The
    dashboard's demo mode (MSW) and the FastAPI service both implement it;
    TypeScript types are generated from this file (`npm run gen:api`).

    Conventions:
      * Returns, weights and exposures are fractions of NAV (0.0123 = 1.23%).
      * Money is in the account base currency (USD).
      * Timestamps are ISO-8601 with offset; dates are YYYY-MM-DD (exchange date, America/New_York).
servers:
  - url: /api/v1

paths:
  /status:
    get:
      operationId: getStatus
      summary: Account, market session, system health, kill switch and today's schedule.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }

  /market/strip:
    get:
      operationId: getMarketStrip
      summary: Reference markets shown in the ticker strip.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketStrip" }

  /portfolio/summary:
    get:
      operationId: getPortfolioSummary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioSummary" }

  /portfolio/positions:
    get:
      operationId: getPositions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionsResponse" }

  /portfolio/intraday:
    get:
      operationId: getIntradayPnl
      summary: P&L path of the latest (or current) session.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntradayPnl" }

  /performance:
    get:
      operationId: getPerformance
      parameters:
        - name: range
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PerformanceRange" }
        - name: benchmark
          in: query
          required: false
          schema: { type: string, default: SPY }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Performance" }

  /benchmarks:
    get:
      operationId: getBenchmarks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Benchmark" }

  /risk:
    get:
      operationId: getRisk
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskReport" }

  /trading/orders:
    get:
      operationId: getOrders
      summary: Orders and fills for the latest session.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrdersResponse" }

  /trading/orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancel requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409":
          description: Order is not cancellable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /trading/rebalance/preview:
    get:
      operationId: getRebalancePreview
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RebalancePreview" }

  /trading/rebalance:
    post:
      operationId: submitRebalance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RebalanceRequest" }
      responses:
        "200":
          description: Orders submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RebalanceResult" }
        "409":
          description: Blocked by a pre-trade check or the kill switch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /ops/doctor:
    get:
      operationId: getDoctor
      summary: Latest IBKR doctor report (src/broker/ibkr/doctor.py).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoctorReport" }

  /ops/doctor/run:
    post:
      operationId: runDoctor
      responses:
        "200":
          description: Fresh report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoctorReport" }

  /ops/exit-test:
    get:
      operationId: getExitTest
      summary: Phase 0's exit test, session by session (trading-engine/src/runtime/exit_test.py).
      description: |
        Ten sessions in a row with the doctor green, the run ending ok, the
        reconcile matching IBKR to the share, and the close within
        nav_tolerance of IBKR's statement (the Flex NAV). A check whose
        evidence isn't in yet is PENDING: today's, and a statement Flex
        publishes the next morning. Pending sessions at the end neither count
        nor break the streak. The last 15 sessions, oldest first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExitTest" }

  /ops/engine-shadow:
    get:
      operationId: getEngineShadow
      summary: The C++ engine's order manager beside the Python one (trading-engine/src/production/engine_shadow.py).
      description: |
        Every run gives the engine (dv02_engine.oms) the inputs the Python
        runner decided on and records whether it decided the same: the
        reconcile of the expected book (reconcile, the run's first step), the
        rebalance gate (drift), the basket the run would build now (whatif,
        every run), the basket the run built (basket, on rebalance days), each
        with the auction it would go to, and the status logs of the orders it
        sent, replayed (orders). A session matches when every
        comparison it ran matched exactly: the same orders, the same shares on
        every line, the same dollars. Nothing the engine decides is sent; it may
        take over sending after `needed` sessions in a row match, an owner
        decision. Newest session first, up to 15.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineShadow" }

  /ops/kill-switch:
    post:
      operationId: setKillSwitch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KillSwitchRequest" }
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KillSwitch" }
        "400":
          description: Arming requires a reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /ops/runs:
    get:
      operationId: getRuns
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunsResponse" }

  /strategies:
    get:
      operationId: getStrategies
      summary: The fund's sleeves against the research gate, and each shadow book's record.
      description: |
        Sleeves come from trading-engine/config/sleeves.yaml: each one's status
        (live, paper, shadow, research, failed) and its walk-forward numbers.
        A shadow book is half the live account and half a sleeve in shadow
        mode, as the research mixed them, each written each evening by
        trading-engine/src/production/shadows.py: H2, S0 with a trend overlay
        (shadow_h2.py, with the orders it would send to replace S0), and R3,
        short the VIX futures premium (shadow_r3.py, with its signal and the
        futures it would hold). Each has its value since its start beside the
        live account's and the sleeve's. Nothing from them is sent.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategiesResponse" }

  /data/datasets:
    get:
      operationId: getDatasets
      summary: Every dataset's watermark against what should exist by now (trading-engine/src/data/datasets.py).
      description: |
        A dataset is ok when it holds the session it should by now, on the NYSE
        calendar and the schedule of the job that fills it; behind when it holds
        an older one; missing when nothing is recorded on this machine; off when
        it isn't kept here (the store without Postgres). `bin/tradeit catchup`
        fills the ones behind that can be filled, and records what it did.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetsResponse" }

  /stream:
    get:
      operationId: openStream
      summary: Live updates over a WebSocket (ws://<host>/api/v1/stream).
      description: |
        Upgrade to a WebSocket; the client sends nothing. On connect the server
        sends one StreamMessage per topic with its current value, then a topic's
        new value whenever it changes (checked about every 2 seconds). Each
        message's `data` is exactly the body its REST endpoint returns:

          status → /status · strip → /market/strip · summary → /portfolio/summary
          positions → /portfolio/positions · intraday → /portfolio/intraday
          orders → /trading/orders

        A topic whose endpoint can't answer right now is skipped; its REST
        endpoint says why. Demo mode has no stream, so the dashboard polls.
      responses:
        "101":
          description: Switching to the WebSocket protocol. Frames are StreamMessage JSON.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamMessage" }

components:
  schemas:
    Problem:
      type: object
      required: [title]
      properties:
        title: { type: string }
        detail: { type: string }

    Health:
      type: string
      enum: [ok, warning, error, unknown]

    SystemStatus:
      type: object
      required: [mode, account, as_of, market, components, kill_switch, schedule]
      properties:
        mode:
          type: string
          enum: [demo, paper, live]
          description: demo = simulated data, not connected to a broker.
        account: { $ref: "#/components/schemas/Account" }
        as_of: { type: string, format: date-time }
        market: { $ref: "#/components/schemas/MarketSession" }
        components:
          type: array
          items: { $ref: "#/components/schemas/Component" }
        kill_switch: { $ref: "#/components/schemas/KillSwitch" }
        schedule:
          type: array
          items: { $ref: "#/components/schemas/ScheduledJob" }

    Account:
      type: object
      required: [id, base_currency]
      properties:
        id: { type: string }
        base_currency: { type: string }

    MarketSession:
      type: object
      required: [session, trading_date, next_change_at, next_change]
      properties:
        session:
          type: string
          enum: [pre, open, post, closed]
        trading_date:
          type: string
          format: date
          description: The current session's date, or the last completed one when closed.
        next_change_at: { type: string, format: date-time }
        next_change:
          type: string
          enum: [opens, closes]

    Component:
      type: object
      required: [id, label, status, detail]
      properties:
        id:
          type: string
          enum: [gateway, market_data, engine, scheduler, database]
        label: { type: string }
        status: { $ref: "#/components/schemas/Health" }
        detail: { type: string }

    KillSwitch:
      type: object
      required: [armed]
      properties:
        armed: { type: boolean }
        reason: { type: string }
        changed_at: { type: string, format: date-time }
        changed_by: { type: string }

    KillSwitchRequest:
      type: object
      required: [armed]
      properties:
        armed: { type: boolean }
        reason: { type: string, description: Required when arming. }

    ScheduledJob:
      type: object
      required: [id, label, at, status]
      properties:
        id: { type: string }
        label: { type: string }
        at: { type: string, format: date-time }
        status:
          type: string
          enum: [scheduled, running, done, failed, skipped]
        detail: { type: string }

    MarketStrip:
      type: object
      required: [as_of, delayed, items]
      properties:
        as_of: { type: string, format: date-time }
        delayed: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/Quote" }

    Quote:
      type: object
      required: [symbol, label, last, change, change_pct, kind]
      properties:
        symbol: { type: string }
        label: { type: string }
        last: { type: number }
        change: { type: number }
        change_pct: { type: number }
        kind:
          type: string
          enum: [index, yield, price, fx]
          description: yield quotes change in percentage points; show change as bp.

    SharpeEstimate:
      type: object
      required: [value, ci_low, ci_high, years]
      properties:
        value: { type: number }
        ci_low: { type: number, description: 95% CI lower bound (normal approximation). }
        ci_high: { type: number }
        years: { type: number }

    PortfolioSummary:
      type: object
      required:
        - as_of
        - inception_date
        - nav
        - cash
        - day_pnl
        - day_return
        - mtd_return
        - ytd_return
        - itd_return
        - benchmark
        - benchmark_itd_return
        - long_exposure
        - short_exposure
        - gross_exposure
        - net_exposure
        - beta
        - sharpe_itd
        - positions_count
        - nav_history
        - history
      properties:
        as_of: { type: string, format: date-time }
        inception_date: { type: string, format: date }
        nav: { type: number }
        cash: { type: number }
        day_pnl: { type: number }
        day_return: { type: number }
        mtd_return:
          type: [number, "null"]
          description: Null when the NAV history doesn't reach the start of the month.
        ytd_return:
          type: [number, "null"]
          description: Null when the NAV history doesn't reach the start of the year.
        itd_return:
          type: [number, "null"]
          description: Null with fewer than two days of NAV history.
        benchmark: { $ref: "#/components/schemas/Benchmark" }
        benchmark_itd_return: { type: [number, "null"] }
        long_exposure: { type: number }
        short_exposure: { type: number, description: Negative fraction of NAV. }
        gross_exposure: { type: number }
        net_exposure: { type: number }
        beta: { type: number, description: Ex-ante beta to the S&P 500. }
        sharpe_itd:
          description: Null with fewer than 20 daily returns.
          oneOf:
            - $ref: "#/components/schemas/SharpeEstimate"
            - type: "null"
        positions_count: { type: integer }
        nav_history:
          type: array
          description: Daily NAV for the last ~30 sessions (sparkline).
          items: { $ref: "#/components/schemas/DatedValue" }
        history: { $ref: "#/components/schemas/HistoryCoverage" }

    HistoryCoverage:
      type: object
      description: How much daily NAV history backs the returns and ratios.
      required: [first_date, days, complete, sources]
      properties:
        first_date: { type: string, format: date, description: "Inception: the first day with a NAV." }
        days: { type: integer, description: Trading days with a NAV. }
        complete:
          type: boolean
          description: True when the history is known to start at inception (IBKR Flex, or a configured start).
        sources:
          type: array
          items: { type: string }

    DatedValue:
      type: object
      required: [date, value]
      properties:
        date: { type: string, format: date }
        value: { type: number }

    AssetClass:
      type: string
      enum: [equity, fixed_income, commodity, crypto, volatility, cash, index_future]

    Position:
      type: object
      required:
        - symbol
        - name
        - asset_class
        - sleeve
        - sec_type
        - quantity
        - multiplier
        - avg_cost
        - last
        - prev_close
        - market_value
        - weight
        - day_pnl
        - day_return
        - unrealized_pnl
        - unrealized_return
        - beta
      properties:
        symbol: { type: string }
        name: { type: string }
        asset_class: { $ref: "#/components/schemas/AssetClass" }
        sleeve: { type: string }
        sec_type:
          type: string
          enum: [STK, ETF, FUT, OPT]
        quantity: { type: number }
        multiplier: { type: number }
        avg_cost: { type: number }
        last: { type: number }
        prev_close: { type: number }
        market_value: { type: number, description: Signed; notional for futures. }
        weight: { type: number }
        target_weight: { type: [number, "null"] }
        day_pnl: { type: number }
        day_return: { type: number }
        unrealized_pnl: { type: number }
        unrealized_return: { type: number }
        beta: { type: number }

    PositionsResponse:
      type: object
      required: [as_of, nav, positions]
      properties:
        as_of: { type: string, format: date-time }
        nav: { type: number }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }

    IntradayPnl:
      type: object
      required: [trading_date, session_open, session_close, live, points]
      properties:
        trading_date: { type: string, format: date }
        session_open: { type: string, format: date-time }
        session_close: { type: string, format: date-time }
        live: { type: boolean, description: True while the session is in progress. }
        points:
          type: array
          items:
            type: object
            required: [t, pnl]
            properties:
              t: { type: string, format: date-time }
              pnl: { type: number }

    StreamTopic:
      type: string
      enum: [status, strip, summary, positions, intraday, orders]

    StreamMessage:
      description: One WebSocket frame from /stream. `data` is the topic's REST body.
      oneOf:
        - type: object
          required: [topic, at, data]
          properties:
            topic: { type: string, const: status }
            at: { type: string, format: date-time }
            data: { $ref: "#/components/schemas/SystemStatus" }
        - type: object
          required: [topic, at, data]
          properties:
            topic: { type: string, const: strip }
            at: { type: string, format: date-time }
            data: { $ref: "#/components/schemas/MarketStrip" }
        - type: object
          required: [topic, at, data]
          properties:
            topic: { type: string, const: summary }
            at: { type: string, format: date-time }
            data: { $ref: "#/components/schemas/PortfolioSummary" }
        - type: object
          required: [topic, at, data]
          properties:
            topic: { type: string, const: positions }
            at: { type: string, format: date-time }
            data: { $ref: "#/components/schemas/PositionsResponse" }
        - type: object
          required: [topic, at, data]
          properties:
            topic: { type: string, const: intraday }
            at: { type: string, format: date-time }
            data: { $ref: "#/components/schemas/IntradayPnl" }
        - type: object
          required: [topic, at, data]
          properties:
            topic: { type: string, const: orders }
            at: { type: string, format: date-time }
            data: { $ref: "#/components/schemas/OrdersResponse" }

    PerformanceRange:
      type: string
      enum: [1W, MTD, 1M, 3M, 6M, YTD, 1Y, ITD]
      default: ITD

    Benchmark:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }

    PerformanceStats:
      type: object
      required:
        - total_return
        - benchmark_total_return
        - ann_return
        - ann_vol
        - sharpe
        - max_drawdown
        - beta
        - alpha_ann
        - tracking_error
        - information_ratio
        - sortino
        - hit_rate
        - best_day
        - worst_day
        - observations
      properties:
        observations: { type: integer, description: Daily returns in the window. }
        total_return: { type: number }
        benchmark_total_return: { type: number }
        ann_return:
          type: [number, "null"]
          description: Null under a year of daily returns; shorter periods are not annualized.
        ann_vol:
          type: [number, "null"]
          description: Null with fewer than 20 daily returns, as are the ratios below.
        sharpe:
          oneOf:
            - $ref: "#/components/schemas/SharpeEstimate"
            - type: "null"
        max_drawdown: { type: number }
        beta: { type: [number, "null"] }
        alpha_ann: { type: [number, "null"] }
        tracking_error: { type: [number, "null"] }
        information_ratio: { type: [number, "null"] }
        sortino: { type: [number, "null"] }
        hit_rate: { type: number, description: Share of up days. }
        best_day: { $ref: "#/components/schemas/DatedValue" }
        worst_day: { $ref: "#/components/schemas/DatedValue" }

    Performance:
      type: object
      required: [range, start, end, benchmark, series, drawdown, stats, monthly]
      properties:
        range: { $ref: "#/components/schemas/PerformanceRange" }
        start: { type: string, format: date }
        end: { type: string, format: date }
        benchmark: { $ref: "#/components/schemas/Benchmark" }
        series:
          type: array
          description: |
            Total-return growth of $100 at `start` (`portfolio`, `benchmark`), and
            the account's NAV in dollars that day (`nav`; deposits and withdrawals
            included, so it can move without a return).
          items:
            type: object
            required: [date, portfolio, benchmark, nav]
            properties:
              date: { type: string, format: date }
              portfolio: { type: number }
              benchmark: { type: number }
              nav: { type: number }
        drawdown:
          type: array
          items: { $ref: "#/components/schemas/DatedValue" }
        stats: { $ref: "#/components/schemas/PerformanceStats" }
        monthly:
          type: array
          description: Monthly returns since inception (not limited by range).
          items:
            type: object
            required: [year, month, portfolio, benchmark]
            properties:
              year: { type: integer }
              month: { type: integer, minimum: 1, maximum: 12 }
              portfolio: { type: number }
              benchmark: { type: number }

    LimitCheck:
      type: object
      required: [id, label, value, limit, unit, status]
      properties:
        id: { type: string }
        label: { type: string }
        value: { type: number }
        limit: { type: number }
        unit:
          type: string
          enum: [pct, ratio, count]
        status:
          type: string
          enum: [ok, warning, breach]
        detail: { type: string }

    RiskReport:
      type: object
      required:
        - as_of
        - nav
        - by_asset_class
        - by_sleeve
        - limits
        - beta
        - forecast_vol
        - target_vol
        - var_95_1d
        - es_975_1d
        - top5_weight
        - scenarios
      properties:
        as_of: { type: string, format: date-time }
        nav: { type: number }
        by_asset_class:
          type: array
          items:
            type: object
            required: [asset_class, long, short, net]
            properties:
              asset_class: { $ref: "#/components/schemas/AssetClass" }
              long: { type: number }
              short: { type: number }
              net: { type: number }
        by_sleeve:
          type: array
          items:
            type: object
            required: [sleeve, gross, net, day_pnl, mandate]
            properties:
              sleeve: { type: string }
              gross: { type: number }
              net: { type: number }
              day_pnl: { type: number }
              mandate: { type: string }
        limits:
          type: array
          items: { $ref: "#/components/schemas/LimitCheck" }
        beta: { type: number }
        forecast_vol: { type: number, description: Annualized ex-ante vol. }
        target_vol: { type: number }
        var_95_1d: { type: number, description: Historical 1-day VaR, fraction of NAV (positive = loss). }
        es_975_1d: { type: number }
        top5_weight: { type: number }
        scenarios:
          type: array
          items:
            type: object
            required: [id, label, pnl, pnl_pct]
            properties:
              id: { type: string }
              label: { type: string }
              pnl: { type: number }
              pnl_pct: { type: number }

    OrderStatus:
      type: string
      enum: [pending, submitted, partial, filled, cancelled, rejected]

    Order:
      type: object
      required:
        - id
        - symbol
        - side
        - quantity
        - filled
        - order_type
        - status
        - submitted_at
        - sleeve
      properties:
        id: { type: string }
        symbol: { type: string }
        side:
          type: string
          enum: [BUY, SELL]
        quantity: { type: number }
        filled: { type: number }
        order_type:
          type: string
          enum: [MKT, LMT, MOC, LOC]
        limit_price: { type: number }
        status: { $ref: "#/components/schemas/OrderStatus" }
        avg_fill_price: { type: number }
        arrival_price: { type: number }
        slippage_bps: { type: number, description: Signed cost vs arrival; positive = paid away. }
        submitted_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        sleeve: { type: string }
        reason: { type: string }

    OrdersResponse:
      type: object
      required: [trading_date, orders]
      properties:
        trading_date: { type: string, format: date }
        orders:
          type: array
          items: { $ref: "#/components/schemas/Order" }

    PreTradeCheck:
      type: object
      required: [id, label, status, detail]
      properties:
        id: { type: string }
        label: { type: string }
        status:
          type: string
          enum: [pass, warn, fail]
        detail: { type: string }

    RebalancePreview:
      type: object
      required: [as_of, sleeve, targets_date, execution, rows, totals, checks, can_submit]
      properties:
        as_of: { type: string, format: date-time }
        sleeve: { type: string }
        targets_date: { type: string, format: date }
        execution:
          type: string
          description: How the orders will execute, e.g. "MOC Mon Oct 12 (cutoff 15:50 ET)".
        rows:
          type: array
          items:
            type: object
            required:
              - symbol
              - current_weight
              - target_weight
              - current_qty
              - target_qty
              - trade_qty
              - est_notional
              - est_cost
            properties:
              symbol: { type: string }
              current_weight: { type: number }
              target_weight: { type: number }
              current_qty: { type: number }
              target_qty: { type: number }
              trade_qty: { type: number, description: Signed. }
              est_notional: { type: number }
              est_cost: { type: number }
        totals:
          type: object
          required: [buy_notional, sell_notional, turnover, est_cost, orders]
          properties:
            buy_notional: { type: number }
            sell_notional: { type: number }
            turnover: { type: number }
            est_cost: { type: number }
            orders: { type: integer }
        checks:
          type: array
          items: { $ref: "#/components/schemas/PreTradeCheck" }
        can_submit: { type: boolean }

    RebalanceRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          const: SUBMIT
          description: Must be the literal string SUBMIT.

    RebalanceResult:
      type: object
      required: [submitted, orders, message]
      properties:
        submitted: { type: integer }
        orders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        message: { type: string }

    DoctorResult:
      type: object
      required: [name, status, detail, fix]
      properties:
        name: { type: string }
        status:
          type: string
          enum: [PASS, WARN, FAIL, SKIP]
        detail: { type: string }
        fix: { type: string }

    DoctorReport:
      type: object
      required: [ran_at, profile, endpoint, results]
      properties:
        ran_at: { type: string, format: date-time }
        profile: { type: string }
        endpoint: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/DoctorResult" }

    Sleeve:
      type: object
      required: [id, name, status, since, summary, sharpe, sharpe_se, max_drawdown, report]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: ["live", "paper", "shadow", "research", "failed"] }
        since: { type: [string, "null"], format: date }
        summary: { type: string }
        sharpe: { type: [number, "null"], description: "walk-forward Sharpe in excess of T-bills" }
        sharpe_se: { type: [number, "null"] }
        max_drawdown: { type: [number, "null"], description: "a fraction, negative" }
        report: { type: [string, "null"], description: "the study's report, a path in the repository" }

    ShadowPoint:
      type: object
      required: [date, book, live, sleeve]
      properties:
        date: { type: string, format: date }
        book: { type: number, description: "the shadow book: growth of 1 since the start" }
        live: { type: number, description: "the live fund, S0" }
        sleeve: { type: number, description: "the sleeve on its own" }

    ShadowHolding:
      type: object
      required: [instrument, quantity, notional]
      properties:
        instrument: { type: string, description: "for example \"VXM 2026-11-18\": a mini VIX future and its expiry" }
        quantity: { type: number, description: "contracts; negative is short" }
        notional: { type: number }

    WouldBeOrder:
      type: object
      required: [symbol, action, quantity, dollars]
      properties:
        symbol: { type: string }
        action: { type: string, enum: ["BUY", "SELL"] }
        quantity: { type: integer }
        dollars: { type: number }

    ShadowBook:
      type: object
      required: [id, name, sleeve, start, sessions, through, points, decision, signal, would_be_orders, holdings]
      properties:
        id: { type: string, description: "the sleeve's id in config/sleeves.yaml" }
        name: { type: string }
        sleeve: { type: string, description: "what the sleeve line is: \"Trend sleeve\", \"VIX futures sleeve\"" }
        start: { type: string, format: date }
        sessions: { type: integer }
        through: { type: [string, "null"], format: date }
        points:
          type: array
          items: { $ref: "#/components/schemas/ShadowPoint" }
        decision:
          description: The sleeve's latest decision, or null before its first.
          oneOf:
            - type: object
              required: [decided, executed, weights]
              properties:
                decided: { type: string, format: date }
                executed: { type: string, format: date }
                weights:
                  type: object
                  additionalProperties: { type: number }
            - type: "null"
        signal:
          type: [string, "null"]
          description: the sleeve's latest signal in a sentence, where it has one (R3's futures against the VIX)
        would_be_orders:
          description: the orders that would take the account from S0 to the shadow book (H2's ETFs)
          type: array
          items: { $ref: "#/components/schemas/WouldBeOrder" }
        holdings:
          description: what the sleeve would hold that the account can't trade yet (R3's VIX futures), at the live NAV
          type: array
          items: { $ref: "#/components/schemas/ShadowHolding" }

    StrategiesResponse:
      type: object
      required: [as_of, sleeves, shadows]
      properties:
        as_of: { type: string, format: date-time }
        sleeves:
          type: array
          items: { $ref: "#/components/schemas/Sleeve" }
        shadows:
          description: every sleeve in shadow mode, each beside the live fund
          type: array
          items: { $ref: "#/components/schemas/ShadowBook" }

    Dataset:
      type: object
      required: [name, title, source, schedule, through, expected, state, rows, written, detail, can_catch_up, findings]
      properties:
        name: { type: string }
        title: { type: string }
        source: { type: string }
        schedule: { type: string, description: "when the job that fills it runs, in plain words" }
        through: { type: [string, "null"], format: date, description: "the latest session it holds" }
        expected: { type: [string, "null"], format: date, description: "the session it should hold by now" }
        state: { type: string, enum: ["ok", "behind", "missing", "off"] }  # quoted: YAML reads a bare off as false
        rows: { type: [integer, "null"] }
        written: { type: [string, "null"], format: date-time, description: "when it was last written" }
        detail: { type: string }
        can_catch_up: { type: boolean, description: "bin/tradeit catchup can fill it" }
        findings:
          type: array
          items: { type: string }
          description: "what a check of its content found, whatever its state (IBKR's bad days in the adjusted closes)"

    CatchupAction:
      type: object
      required: [dataset, ok, detail]
      properties:
        dataset: { type: string }
        ok: { type: boolean }
        detail: { type: string }

    Catchup:
      type: object
      required: [at, actions]
      properties:
        at: { type: string, format: date-time }
        actions:
          type: array
          items: { $ref: "#/components/schemas/CatchupAction" }

    DatasetsResponse:
      type: object
      required: [as_of, datasets, last_catchup]
      properties:
        as_of: { type: string, format: date-time }
        datasets:
          type: array
          items: { $ref: "#/components/schemas/Dataset" }
        last_catchup:
          oneOf:
            - $ref: "#/components/schemas/Catchup"
            - type: "null"

    ExitCheck:
      type: object
      required: [status, note]
      properties:
        status: { type: string, enum: [PASS, FAIL, PENDING] }
        note: { type: string, description: "why it failed or waits; for nav, the close against the statement" }

    ExitSession:
      type: object
      required: [day, status, checks]
      properties:
        day: { type: string, format: date }
        status: { type: string, enum: [PASS, FAIL, PENDING] }
        checks:
          type: object
          required: [doctor, run, reconcile, nav]
          properties:
            doctor: { $ref: "#/components/schemas/ExitCheck" }
            run: { $ref: "#/components/schemas/ExitCheck" }
            reconcile: { $ref: "#/components/schemas/ExitCheck" }
            nav: { $ref: "#/components/schemas/ExitCheck" }

    ExitTest:
      type: object
      required: [profile, needed, streak, nav_tolerance, sessions]
      properties:
        profile: { type: string }
        needed: { type: integer, description: "sessions in a row that pass it (10)" }
        streak: { type: integer }
        nav_tolerance: { type: number, description: "how far the close may be from the statement, a fraction of NAV (0.001 = 0.10%)" }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/ExitSession" }

    EngineShadowCheck:
      type: object
      required: [match, summary, at]
      properties:
        match: { type: boolean }
        summary: { type: string, description: "\"same 9 orders\", \"same decision\", \"same 0 breaks\", or the first difference" }
        at: { type: string, format: date-time }

    EngineShadowSession:
      type: object
      required: [session, match, comparisons, kinds]
      properties:
        session: { type: string, format: date }
        match: { type: boolean, description: "every comparison that session matched" }
        comparisons: { type: integer }
        kinds:
          type: object
          description: the session's last comparison of each kind it ran
          properties:
            reconcile: { $ref: "#/components/schemas/EngineShadowCheck" }
            drift: { $ref: "#/components/schemas/EngineShadowCheck" }
            whatif: { $ref: "#/components/schemas/EngineShadowCheck" }
            basket: { $ref: "#/components/schemas/EngineShadowCheck" }
            orders: { $ref: "#/components/schemas/EngineShadowCheck" }

    EngineShadow:
      type: object
      required: [streak, needed, ready, sessions, last_difference, comparisons, role, role_note]
      properties:
        role:
          type: string
          enum: [shadow, cosign]
          description: >-
            config/engine.yaml: shadow, the engine's decisions are recorded and Python's orders go out either way;
            cosign, a run sends no order unless the engine decided its reconcile, drift gate and basket the same
        role_note: { type: [string, "null"], description: "why the role is cosign when the file didn't say shadow or cosign" }
        streak: { type: integer, description: "sessions in a row, back from the latest, with every comparison matching" }
        needed: { type: integer, description: "sessions in a row before the engine may take over sending (10)" }
        ready: { type: boolean }
        comparisons: { type: integer }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/EngineShadowSession" }
        last_difference:
          oneOf:
            - $ref: "#/components/schemas/EngineShadowSession"
            - type: "null"

    Run:
      type: object
      required: [id, kind, started_at, ok, summary, steps]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [daily, reconcile, catchup, doctor, rebalance]
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        ok: { type: boolean }
        dry_run: { type: boolean }
        summary: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [name, ok, detail]
            properties:
              name: { type: string }
              ok: { type: boolean }
              detail: { type: string }

    RunsResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/Run" }
