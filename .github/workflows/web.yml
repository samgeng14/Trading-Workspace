name: web

# services/api, trading-engine and engine: the staging-e2e job runs the real API
on:
  pull_request:
    paths: ["apps/web/**", "schemas/**", "services/api/**", "trading-engine/src/**", "trading-engine/config/**", "engine/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", "schemas/**", "services/api/**", "trading-engine/src/**", "trading-engine/config/**", "engine/**", ".github/workflows/web.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: API types match schemas/api/v1.yaml
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Every control works (e2e against the demo backend)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  staging-e2e:
    # The dashboard in paper mode on the staging API (services/api/dv02_api/staging.py): the real
    # app over a made-up copy of the paper account, so every page meets real labels, 37 holdings
    # and a one-day NAV history, in both themes, on a laptop and a phone.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: The API and the C++ engine it checks leverage with
        run: pip install -r ../../services/api/requirements.txt ../../engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Every page fits real data (e2e against the staging API)
        run: npm run e2e:staging
        env:
          DV02_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-staging-report
          path: apps/web/test-results
          retention-days: 7
